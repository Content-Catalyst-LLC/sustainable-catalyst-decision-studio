services:
  decision-studio:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sustainable-catalyst-decision-studio:2.1.0
    container_name: sc-decision-studio
    restart: unless-stopped
    environment:
      PORT: "8089"
    ports:
      - "127.0.0.1:8089:8089"
    networks:
      - sc-internal

networks:
  sc-internal:
    external: true
