services:
  - type: web
    name: sustainable-catalyst-decision-studio
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: SCDS_BUILD_FINGERPRINT
        value: scds-v3.9.0-unified-decision-module-registry
      - key: SCDS_SOURCE_COMMIT
        value: release-v3.9.0
      - key: SCDS_MAX_REQUEST_BYTES
        value: 1048576
      - key: SCDS_PUBLIC_RATE_LIMIT
        value: 60
      - key: SCDS_PERSISTENCE_REQUIRED
        value: "true"
      - key: SCDS_PERSISTENCE_WRITE_ENABLED
        value: "true"
